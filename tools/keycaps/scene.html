<!doctype html><html><head><meta charset="utf-8">
<style>body{margin:0;background:transparent}</style>

<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RectAreaLightUniformsLib } from 'three/addons/lights/RectAreaLightUniformsLib.js';

const P = window.PARAMS;
for (const [u, r] of [['brico.woff2', undefined], ['brico-x.woff2', 'U+0100-024F']]) {
  const f = new FontFace('B', `url(${u})`, r ? { weight: '200 800', unicodeRange: r } : { weight: '200 800' }); await f.load(); document.fonts.add(f);

RectAreaLightUniformsLib.init();

// big soft key light upper-left / slightly behind (matches the case's highlights) + cool strip rim + faint fill

const key = new THREE.RectAreaLight(0xfff3e8, L.key, 260, 260); key.position.set(-260, 320, -120); key.lookAt(0, 0, 0); scene.add(key);
const rim = new THREE.RectAreaLight(0xe9f0ff, L.rim, 400, 40); rim.position.set(-60, 220, -320); rim.lookAt(0, 0, 0); scene.add(rim);
const fill = new THREE.RectAreaLight(0xdfe6ff, L.fill, 300, 300); fill.position.set(320, 160, 260); fill.lookAt(0, 0, 0); scene.add(fill);

const sh = new THREE.DirectionalLight(0xffffff, L.shadowLight); sh.position.set(-260, 320, -120); sh.castShadow = true;
sh.shadow.mapSize.set(2048, 2048); sh.shadow.radius = 14; sh.shadow.blurSamples = 24; sh.shadow.bias = -0.0005;
const sc = sh.shadow.camera; sc.left = -120; sc.right = 120; sc.top = 120; sc.bottom = -120; sc.near = 1; sc.far = 1200; scene.add(sh);
// shadow catcher at the well floor (only the shadow is rendered)
const floor = new THREE.Mesh(new THREE.PlaneGeometry(600, 600), new THREE.ShadowMaterial({ opacity: P.shadowOpacity }));
floor.rotation.x = -Math.PI / 2; floor.position.y = P.floorY; floor.receiveShadow = true; scene.add(floor);

/* ---- cap geometry (lofted, cylindrical dish, filleted top edge, AO baked in vertex colours) ---- */
function rrect(w, d, r, n = 12) {

function cap(W, D, o) {

    const e = t;

    const ao = 1 - o.ao * Math.pow(1 - p[1] / o.h, 2.2); col.push(ao, ao, ao);

  }

  g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3)); g.setIndex(idx); g.computeVertexNormals();

}
async function svgImage(svg, color) {

  const img = new Image(); img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(s); await img.decode(); return img;
}
function noise(size, base, amt) {
  const c = document.createElement('canvas'); c.width = c.height = size; const x = c.getContext('2d'); const id = x.createImageData(size, size);
  for (let i = 0; i < id.data.length; i += 4) { const v = base + (Math.random() - .5) * amt; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 255; }

async function topTex(k, aspect) {

  x.fillStyle = k.face; x.fillRect(0, 0, W, H); x.globalAlpha = .9; x.fillStyle = k.ink;
  const fit = (txt, fs, maxW) => { x.font = `600 ${fs}px B`; while (x.measureText(txt).width > maxW && fs > 30) { fs -= 4; x.font = `600 ${fs}px B`; } return fs; };

  } else {

/* ---- camera from the solved photo geometry ---- */
const C = P.camera;
const cam = new THREE.PerspectiveCamera(C.fov, C.width / C.height, 5, 5000);

  cam.setViewOffset(C.width, C.height, 0, 0, C.width, C.height);
}
cam.updateProjectionMatrix();

window.renderKey = async (k) => {
  const { g, aspect } = cap(k.W, k.D, { W: k.W, D: k.D, h: k.h, tx: k.tx, tf: k.tf, tb: k.tb, rb: k.rb, rt: k.rt, fillet: k.fillet, dish: k.dish, ao: P.ao });
  const common = { roughness: P.rough, roughnessMap: noise(256, 160, 70), bumpMap: noise(512, 128, 255), bumpScale: P.bump, metalness: 0,
    sheen: .3, sheenRoughness: .9, sheenColor: new THREE.Color(0xcfd6e0), specularIntensity: P.spec, vertexColors: true };

window.project = (x, y, z) => { cam.setViewOffset(C.width, C.height, C.offX || 0, C.offY || 0, C.width, C.height); cam.updateProjectionMatrix(); const v = new THREE.Vector3(x, y, z).project(cam); return [(v.x + 1) / 2 * C.width, (1 - v.y) / 2 * C.height]; };
window.ready = true;
</script></body></html>
